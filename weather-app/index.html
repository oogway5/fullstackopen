<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Weather App</h1>

    <form id="weatherForm">
      <input type="text" id="textInput" placeholder="Enter longitude" />
      <input type="text" id="textInput2" placeholder="Enter latitude" />

      <button type="submit">Get Weather</button>
    </form>

    <button id="toggleUnit">Toggle °C / °F</button>

    <div id="result">
      <p id="temperature"></p>
      <p id="wind"></p>
      <p id="weatherCode"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
